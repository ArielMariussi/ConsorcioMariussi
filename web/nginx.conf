server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Arquivos .wasm do Blazor sempre com o tipo application/wasm.
    # "types { }" vazio só vale dentro deste location; o resto do site
    # continua usando os tipos padrão do nginx (css, js, json...).
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        try_files $uri =404;
    }

    # Rotas do Blazor (/login, /cadastro...) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
