<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · ConsórcioMariussi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-simple">

  <main class="auth-card">
    <a href="index.html" class="brand auth-card__brand">
      <span class="brand__mark">CM</span>
      <span class="brand__name">Consórcio<strong>Mariussi</strong></span>
    </a>

    <h1 class="auth-card__title">Entrar</h1>

    <!-- Exemplo de erro vindo da API -->
    <p class="alert alert--error auth-card__alert">E-mail ou senha inválidos.</p>

    <form action="/auth/login" method="post" class="auth__form">
      <label class="field">
        <span>E-mail</span>
        <input type="email" name="email" required autocomplete="email" class="input" placeholder="voce@email.com">
      </label>

      <label class="field">
        <span>Senha</span>
        <input type="password" name="senha" required autocomplete="current-password" class="input" placeholder="••••••••">
      </label>

      <button type="submit" class="btn btn--primary btn--block">Entrar</button>
    </form>

    <p class="auth__switch">Ainda não tem conta? <a href="cadastro.html" class="link">Criar conta</a></p>
  </main>

</body>
</html>
